[platformio]
default_envs = monitor

[env]
platform = espressif32 @ 6.13.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    paulstoffregen/OneWire @ 2.3.8
    milesburton/DallasTemperature @ 3.11.0
    bblanchon/ArduinoJson @ 6.21.5
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I include

; Default: real sensors, no output pins driven. Safe for USB development.
[env:monitor]

; Synthetic sensor values and controller commands; never drives outputs.
[env:simulation]
build_flags = ${env.build_flags} -D MYMS_SIMULATION=1

; Explicit opt-in after reviewing include/hardware_config.h and actual wiring.
[env:dryer]
build_flags = ${env.build_flags} -D MYMS_OUTPUTS_ENABLED=1
